services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealer_crm
      POSTGRES_PASSWORD: dealer_crm_dev_password
      POSTGRES_DB: dealer_crm
    ports:
      - "5432:5432"
    volumes:
      - dealer_crm_pgdata:/var/lib/postgresql/data

volumes:
  dealer_crm_pgdata:
